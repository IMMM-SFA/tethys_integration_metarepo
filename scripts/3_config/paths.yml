# Environment-keyed base paths used across the metarepo.
#
# Intended as the single source of truth for where inputs and outputs
# live on each supported environment. Legacy scripts still hard-code
# paths; those are documented below and should be migrated as they're
# touched.
#
# To use from Python:
#   import yaml, os
#   with open('scripts/3_config/paths.yml') as f:
#       paths = yaml.safe_load(f)
#   env = os.environ.get('TETHYS_ENV', 'local')
#   tethys_output = paths['environments'][env]['tethys_output']

environments:

  local:
    # macOS laptop with external data volume
    data_root: /Volumes/data
    tethys_output: /Volumes/data/tethys
    tethys_raw_output: /Volumes/data/tethys/output
    tethys_canonical_output: /Volumes/data/tethys/output_adjusted_usgs_method2
    data_release: /Volumes/data/tethys/tethys-dataset-msdlive_2026-06-04
    shapefiles: /Volumes/data/shapefiles
    tgw_hydro: /Volumes/data/tgw-hydro
    mosartwmpy_output: /Volumes/data/mosartwmpy
    # usgs_baseline has no local copy; adjust_runoff_shares_method2_kazi.py
    # runs on deception only until one is staged here.

  pnl_pic:
    # Legacy PNNL PIC cluster; many .py / .sh wrappers still point here
    tethys_base: /pic/projects/im3/tethys/tethys-im3-scenarios
    tethys_data: /pic/projects/im3/tethys/tethys-im3-scenarios/data
    gcam_scenarios: /pic/projects/im3/tethys/tethys-im3-scenarios/data/gcam
    monthly_deficit: /pic/projects/im3/tethys/tethys-im3-scenarios/data/monthly/deficit
    venv: /pic/projects/im3/tethys/tethys-im3-scenarios/venv

  pnl_rcfs:
    # Current PNNL HPC target (deception).
    #
    # Code and bulk output live in different directories here. This repo is
    # the code copy; the 33G raw and adjusted output trees stay in
    # tethys-metarepo-hasan, which was named tethys-metarepo until it was
    # renamed to mark it as Hasan's working copy.
    project_root: /rcfs/projects/im3
    tethys_base: /rcfs/projects/im3/tethys
    metarepo: /rcfs/projects/im3/tethys/tethys-integration-metarepo
    # 43G already in the category layout, all nine scenarios. Read by
    # run_scenario_decep.py as ../../../../input, and merged in by
    # link_data_layout.py so the repo need not carry a second copy.
    structured_input: /rcfs/projects/im3/tethys/input
    tethys_raw_output: /rcfs/projects/im3/tethys/tethys-metarepo-hasan/output
    tethys_canonical_output: /rcfs/projects/im3/tethys/tethys-metarepo-hasan/output_adjusted_usgs_method2
    usgs_baseline: /rcfs/projects/im3/tethys/tethys-metarepo-hasan/scripts/adjust_runoff_shares/usgs_preprocessed_baseline.nc
    data_release: /rcfs/projects/im3/tethys/tethys-water-demand-data
    mosartwmpy_base: /rcfs/projects/im3/mosartwmpy
    venv_default: /rcfs/projects/im3/tethys/venv
    venv_rocky: /rcfs/projects/im3/tethys/venv_rocky

  nersc:
    # Used only by scripts/0_preprocessing/gsi_nersc/*
    project_root: /global/cfs/projectdirs/m2702
    tgw_forcing: /global/cfs/projectdirs/m2702/gsharing/tgw-wrf-conus
    tethys_demand: /global/cfs/projectdirs/m2702/dardiry/Tethys_Demand

# Legacy hard-coded paths currently baked into scripts.
# Migration target: replace each with a lookup against environments above.
# (Listed here so future refactors know what to touch.)
legacy_hardcodes:

  scripts/0_preprocessing/compute_gsi.py:
    input_file: /pic/projects/im3/dardiry/Tethys_Demand/Outputs/TGW/{folder}/daily/met_variables/wrf_variables_tethys_demand_*.nc
    output_file: /pic/projects/im3/tethys/tethys-im3-scenarios/data/monthly/deficit/gsi_{scenario}.nc

  scripts/0_preprocessing/compute_deficit.py:
    input_file: /pic/projects/im3/dardiry/Tethys_Demand/Outputs/TGW/{folder}/daily/GSI/TGW_PRECIP_ET0_GSI_*.nc
    output_file: /pic/projects/im3/tethys/tethys-im3-scenarios/data/monthly/deficit/deficit_{scenario}.nc

  scripts/0_preprocessing/compute_monthly_weights.py:
    deficit_file: /pic/projects/im3/tethys/tethys-im3-scenarios/data/monthly/deficit/deficit_{scenario}.nc
    gsi_file: /pic/projects/im3/tethys/tethys-im3-scenarios/data/monthly/deficit/gsi_{scenario}.nc
    output_file: /pic/projects/im3/tethys/tethys-im3-scenarios/data/monthly/deficit/irrigation_weight_{scenario}.nc

  scripts/0_preprocessing/compute_gsi.sh:
    invokes: /pic/projects/im3/tethys/tethys-im3-scenarios/data/monthly/deficit/compute_gsi.py
    note: invokes a PIC-resident copy of compute_gsi.py, not the repo's copy.

  scripts/0_preprocessing/compute_deficit.sh:
    invokes: /pic/projects/im3/tethys/tethys-im3-scenarios/data/monthly/deficit/compute_deficit.py
    note: same PIC-resident pattern.

  scripts/0_preprocessing/gsi_nersc/TGW_PET_GSI_NERSC.py:
    cwd: /global/cfs/projectdirs/m2702/dardiry/Tethys_Demand/
    wrf_input: /global/cfs/projectdirs/m2702/gsharing/tgw-wrf-conus/{scenario}/hourly/...
    output: /global/cfs/projectdirs/m2702/dardiry/Tethys_Demand/Outputs/TGW/{...}
