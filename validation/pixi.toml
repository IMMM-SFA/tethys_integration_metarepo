[workspace]
authors = ["Cam Bracken <cameron.bracken@pnnl.gov>"]
channels = ["conda-forge"]
name = "validation"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
postprocess-tethys = "python 1-postprocess-tethys.py"
