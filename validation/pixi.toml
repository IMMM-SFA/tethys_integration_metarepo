[workspace]
authors = ["Cam Bracken <cameron.bracken@pnnl.gov>"]
channels = ["conda-forge"]
name = "validation"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
postprocess-tethys = "python 1-postprocess-tethys.py"
process-usgs = "Rscript 2a-process-usgs-data.R"
combine-usgs-tethys = "Rscript 3-combine-usgs-tethys.R"
compare-huc = "Rscript 4a-compare-tethys-usgs.R"
