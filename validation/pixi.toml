geopandas = ">=1.1.3,<2"
xagg = ">=0.3.3.1,<0.4"
r-base = ">=4.4"
r-tidyverse = "*"
r-sf = "*"
r-ncdf4 = "*"
r-scico = "*"
r-ggthemes = "*"
r-yaml = "*"
pyyaml = "*"
rioxarray = "*"
matplotlib-base = "*"
netcdf4 = ">=1.7.4,<2"
numpy = ">=2.4.6,<3"
pandas = ">=3.0.3,<4"
matplotlib = ">=3.10.9,<4"
dask = ">=2026.3.0,<2027"
yaml = ">=0.2.5,<0.3"
